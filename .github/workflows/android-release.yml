name: Android APK Release

on:
  push:
    tags:
      - 'v*'
      - 'android-*'
  workflow_dispatch:
    inputs:
      abis:
        description: 'Comma-separated Android ABIs to build (e.g. arm64-v8a or arm64-v8a,x86_64)'
        required: false
        default: 'arm64-v8a'
      build_type:
        description: 'Gradle build variant'
        type: choice
        options:
          - release
          - debug
        default: 'release'
      publish_release:
        description: 'Publish APK(s) to a GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag name (defaults to android-YYYYMMDD-<shortsha>)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
      LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      GRADLE_OPTS: '-Xmx4096m'

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            ccache \
            cmake \
            flex \
            libtool \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            python3 \
            python3-venv \
            unzip \
            zip

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version

      - name: Install Android SDK & NDK r29
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;29.0.14206865"

      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-cargo-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          key: android-vcpkg-${{ inputs.abis || 'arm64-v8a' }}-${{ hashFiles('vcpkg.json', 'Meta/CMake/vcpkg/**') }}
          restore-keys: |
            android-vcpkg-${{ inputs.abis || 'arm64-v8a' }}-
            android-vcpkg-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-ccache-${{ inputs.abis || 'arm64-v8a' }}-${{ github.sha }}
          restore-keys: |
            android-ccache-${{ inputs.abis || 'arm64-v8a' }}-

      - name: Bootstrap vcpkg
        run: ./Meta/ladybird.py vcpkg --preset Release

      - name: Decode release keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; Gradle will sign with the debug keystore."
          fi

      - name: Build Android APK
        working-directory: ${{ github.workspace }}/UI/Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          if [ "${BUILD_TYPE}" = "debug" ]; then
            TASK="assembleDebug"
          else
            TASK="assembleRelease"
          fi
          ./gradlew "${TASK}" "-Pladybird.abis=${ABIS}" --console=plain

      - name: Collect and checksum APK artifacts
        id: apks
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-apks"
          APK_DIR="${GITHUB_WORKSPACE}/UI/Android/build/outputs/apk/${BUILD_TYPE}"
          ABI_LABEL="$(echo "${ABIS}" | tr ',' '-')"
          for apk in "${APK_DIR}"/*.apk; do
            [ -f "${apk}" ] || continue
            cp "${apk}" "${RUNNER_TEMP}/release-apks/Ladybird-Android-${ABI_LABEL}-${BUILD_TYPE}.apk"
          done
          (cd "${RUNNER_TEMP}/release-apks" && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh "${RUNNER_TEMP}/release-apks"
          cat "${RUNNER_TEMP}/release-apks/SHA256SUMS.txt"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="android-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-apk-${{ inputs.build_type || 'release' }}
          path: ${{ runner.temp }}/release-apks/*

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apks.outputs.tag }}
          name: Ladybird Android (${{ steps.apks.outputs.tag }})
          prerelease: true
          generate_release_notes: true
          files: ${{ runner.temp }}/release-apks/*
