name: Sync Upstream Ladybird

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream Ladybird branch to merge'
        required: false
        default: 'master'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream Ladybird
        id: merge
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          git remote add upstream https://github.com/LadybirdBrowser/ladybird.git || git remote set-url upstream https://github.com/LadybirdBrowser/ladybird.git
          git fetch upstream "${UPSTREAM_BRANCH}"
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          SYNC_BRANCH="sync-upstream-$(date +%Y%m%d)-$(git rev-parse --short upstream/${UPSTREAM_BRANCH})"
          git checkout -b "${SYNC_BRANCH}"

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflicts detected when merging upstream/${UPSTREAM_BRANCH}:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Push sync branch and open PR
        if: steps.merge.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${{ steps.merge.outputs.sync_branch }}"
          gh pr create \
            --base "${{ steps.merge.outputs.target_branch }}" \
            --head "${{ steps.merge.outputs.sync_branch }}" \
            --title "Sync upstream Ladybird (${{ inputs.upstream_branch || 'master' }})" \
            --body "Automated merge of latest upstream \`LadybirdBrowser/ladybird\` into \`${{ steps.merge.outputs.target_branch }}\`."
